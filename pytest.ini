[pytest]
testpaths = tests
norecursedirs = artifacts build dist .runtime .venv .tmp* node_modules
; 실 프린터(e2e_device)/실 네이티브 창(e2e_native)은 하드웨어·UI 세션 필요 — 수동 실행 전용
; e2e_packaged의 UIA 스위트(COM 크래시)·src/exe parity 스위트(exe 기동·창 생성)도 수동/게이트 전용
addopts = --ignore=tests/e2e_device --ignore=tests/e2e_native --ignore=tests/e2e_packaged/test_packaged_app.py --ignore=tests/e2e_packaged/test_scenario_parity.py
